name: Build Ciao English APK

on:
  workflow_dispatch:
  push:
    branches:
      - ciao-english-wife
    paths:
      - 'ciao-english-android/**'
      - '.github/workflows/ciao-english-android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciao-english-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ciao-english-wife

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciao-english-apk
          path: ciao-english-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK at a fixed repository path
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Ciao-English.apk
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add dist/Ciao-English.apk
          if git -C .. diff --cached --quiet; then
            echo "APK unchanged"
          else
            git -C .. commit -m "Build Ciao English APK"
            git -C .. push origin HEAD:ciao-english-wife
          fi
