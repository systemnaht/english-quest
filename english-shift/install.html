<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Shift installieren</title>
<meta name="theme-color" content="#596beb">
<link rel="manifest" href="/manifest.webmanifest?v=4">
<link rel="icon" href="/icon-192.png?v=4" type="image/png" sizes="192x192">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f6f7fb;color:#172039;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,100%);background:#fff;border:1px solid #e3e7f0;border-radius:24px;padding:24px;text-align:center;box-shadow:0 16px 50px #26324c18}.icon{width:112px;height:112px;border-radius:26px;display:block;margin:0 auto 16px;box-shadow:0 10px 28px #23345b30}h1{margin:0 0 8px;font-size:28px}p{color:#69738a;line-height:1.45}.status{padding:11px 12px;background:#f1f3ff;border-radius:14px;margin:16px 0;font-weight:700}.ok{background:#eaf9f4;color:#187558}.warn{background:#fff6df;color:#8a6514}button{width:100%;border:0;border-radius:15px;padding:14px 16px;font-size:17px;font-weight:800;background:#596beb;color:#fff}button:disabled{opacity:.45}.small{font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<img class="icon" src="/icon-192.png?v=4" alt="English Shift Icon">
<h1>English Shift</h1>
<p>Als richtige App installieren – mit eigenem Icon und ohne Chrome-Badge.</p>
<div id="status" class="status">Installation wird geprüft …</div>
<button id="install" disabled>App installieren</button>
<p id="help" class="small"></p>
</div>
<script>
let promptEvent=null;
const btn=document.getElementById('install');
const status=document.getElementById('status');
const help=document.getElementById('help');
function ready(){status.className='status ok';status.textContent='Bereit zur Installation';btn.disabled=false;}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;ready();});
window.addEventListener('appinstalled',()=>{status.className='status ok';status.textContent='Installiert ✓';btn.disabled=true;help.textContent='Du kannst die App jetzt vom Homescreen öffnen.';});
btn.addEventListener('click',async()=>{
 if(!promptEvent){help.textContent='Chrome bietet die PWA-Installation noch nicht an. Entferne zuerst eine eventuell vorhandene alte English-Shift-App vom Homescreen und lade diese Seite neu.';return;}
 promptEvent.prompt();
 const choice=await promptEvent.userChoice;
 promptEvent=null;
 if(choice.outcome==='accepted'){status.textContent='Installation läuft …';btn.disabled=true;}else{status.className='status warn';status.textContent='Installation abgebrochen';}
});
(async()=>{
 if(matchMedia('(display-mode: standalone)').matches){status.className='status ok';status.textContent='Bereits als App geöffnet';btn.disabled=true;return;}
 if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;}catch(e){}}
 setTimeout(()=>{if(!promptEvent&&!btn.disabled===false)return;if(!promptEvent){status.className='status warn';status.textContent='Chrome meldet noch keine PWA-Installation';help.textContent='Falls bereits ein altes English-Shift-Icon vorhanden ist: lange drücken → Entfernen/Deinstallieren, dann diese Seite neu laden.';}},2500);
})();
</script>
</body>
</html>
