<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="StormSpeak app icon">
  <defs>
    <radialGradient id="bg" cx="42%" cy="35%" r="78%">
      <stop offset="0" stop-color="#3530b7"/>
      <stop offset="0.48" stop-color="#27117b"/>
      <stop offset="1" stop-color="#10052f"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff34f"/>
      <stop offset="0.48" stop-color="#ffc619"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#cfc7ff"/>
    </linearGradient>
    <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#080018" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <!-- storm clouds -->
  <g fill="#22106d" opacity="0.9">
    <circle cx="77" cy="149" r="50"/><circle cx="116" cy="126" r="58"/><circle cx="154" cy="153" r="47"/>
    <circle cx="374" cy="135" r="49"/><circle cx="416" cy="116" r="58"/><circle cx="452" cy="154" r="50"/>
    <circle cx="81" cy="402" r="53"/><circle cx="130" cy="420" r="49"/><circle cx="403" cy="411" r="56"/><circle cx="451" cy="388" r="48"/>
  </g>
  <!-- electric arcs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowB)">
    <path d="M53 111l34 28-22 24 48 28-23 26 41 25" stroke="#49e6ff" stroke-width="9"/>
    <path d="M455 103l-29 30 19 24-42 28 18 27-38 28" stroke="#e45bff" stroke-width="9"/>
    <path d="M57 377l31-19 22 19 31-21" stroke="#54dfff" stroke-width="7" opacity="0.9"/>
    <path d="M366 380l27-21 28 18 31-25" stroke="#da4fff" stroke-width="7" opacity="0.9"/>
  </g>
  <!-- speech bubble ring -->
  <path d="M257 95c-89 0-161 68-161 151 0 45 21 86 57 114l-17 67 71-35c16 4 33 6 50 6 89 0 161-68 161-152S346 95 257 95z" fill="none" stroke="url(#ring)" stroke-width="31" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- stylized S / lightning -->
  <path d="M330 118L202 201h81l-78 70h87l-112 124 43-99h-90l76-70h-82l203-108z" fill="url(#bolt)" stroke="#ff6b00" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M319 126L212 196h56l-28 24" fill="none" stroke="#fff58d" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
</svg>
