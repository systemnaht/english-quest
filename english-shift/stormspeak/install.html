<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StormSpeak installieren</title>
<meta name="theme-color" content="#121b46">
<link rel="manifest" href="/stormspeak/manifest.webmanifest?v=4">
<link rel="icon" href="/stormspeak/icon-192.png?v=4" type="image/png" sizes="192x192">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,#101c48,#071129);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(440px,100%);background:#111d45;border:1px solid #30477f;border-radius:24px;padding:24px;text-align:center;box-shadow:0 16px 50px #02061780}.icon{width:112px;height:112px;border-radius:26px;display:block;margin:0 auto 16px;box-shadow:0 10px 28px #02061780}h1{margin:0 0 8px;font-size:28px}p{color:#b9c4e8;line-height:1.45}.status{padding:11px 12px;background:#182958;border-radius:14px;margin:16px 0;font-weight:700}.ok{background:#113b36;color:#8ff1c4}.warn{background:#382f18;color:#ffe69a}button{width:100%;border:0;border-radius:15px;padding:14px 16px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#38d9ff,#9b6bff);color:#fff}button:disabled{opacity:.45}.small{font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<img class="icon" src="/stormspeak/icon-192.png?v=4" alt="StormSpeak Icon">
<h1>StormSpeak</h1>
<p>Als richtige App installieren – mit eigenem Icon und ohne Chrome-Badge.</p>
<div id="status" class="status">Installation wird geprüft …</div>
<button id="install" disabled>App installieren</button>
<p id="help" class="small"></p>
</div>
<script>
let promptEvent=null;
const btn=document.getElementById('install');
const status=document.getElementById('status');
const help=document.getElementById('help');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;status.className='status ok';status.textContent='Bereit zur Installation';btn.disabled=false;});
window.addEventListener('appinstalled',()=>{status.className='status ok';status.textContent='Installiert ✓';btn.disabled=true;help.textContent='Du kannst die App jetzt vom Homescreen öffnen.';});
btn.addEventListener('click',async()=>{
 if(!promptEvent){help.textContent='Chrome bietet die PWA-Installation noch nicht an. Entferne zuerst eine eventuell vorhandene alte StormSpeak-App vom Homescreen und lade diese Seite neu.';return;}
 promptEvent.prompt();
 const choice=await promptEvent.userChoice;
 promptEvent=null;
 if(choice.outcome==='accepted'){status.textContent='Installation läuft …';btn.disabled=true;}else{status.className='status warn';status.textContent='Installation abgebrochen';}
});
(async()=>{
 if(matchMedia('(display-mode: standalone)').matches){status.className='status ok';status.textContent='Bereits als App geöffnet';btn.disabled=true;return;}
 if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('/stormspeak/sw.js',{scope:'/stormspeak/',updateViaCache:'none'});await navigator.serviceWorker.ready;}catch(e){}}
 setTimeout(()=>{if(!promptEvent){status.className='status warn';status.textContent='Chrome meldet noch keine PWA-Installation';help.textContent='Falls bereits ein altes StormSpeak-Icon vorhanden ist: lange drücken → Entfernen/Deinstallieren, dann diese Seite neu laden.';}},2500);
})();
</script>
</body>
</html>
