<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="English Shift app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d9b"/>
      <stop offset="0.45" stop-color="#08245f"/>
      <stop offset="1" stop-color="#041536"/>
    </linearGradient>
    <linearGradient id="sgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54ddff"/>
      <stop offset="0.48" stop-color="#1a9dff"/>
      <stop offset="1" stop-color="#1454f0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00081e" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#3a74de" stroke-width="7" fill="none">
    <circle cx="256" cy="258" r="191"/>
    <ellipse cx="256" cy="258" rx="90" ry="191"/>
    <path d="M75 198h362M75 319h362M256 67v382"/>
    <path d="M103 396c58-43 117-64 177-61 57 2 105 20 145 52"/>
  </g>
  <g filter="url(#shadow)">
    <!-- rounded E -->
    <path d="M101 142c0-25 20-45 45-45h124c14 0 24 11 21 25l-9 34c-3 10-12 17-22 17h-80v55h64v62h-64v53h83c10 0 19 7 22 17l10 34c4 14-7 28-22 28H146c-25 0-45-20-45-45V142z" fill="#fff"/>
    <!-- E exchange arrow -->
    <path d="M199 225h54v-21l57 54-57 54v-22h-54z" fill="#fff"/>
    <!-- S stroke -->
    <path d="M383 155c-21-19-51-30-82-30-41 0-72 22-72 57 0 39 36 49 75 60 38 11 70 20 70 58 0 41-37 69-88 69-36 0-72-12-98-34" fill="none" stroke="url(#sgrad)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- lower shift arrow integrated with S -->
    <path d="M312 333h-49v-24l-58 53 58 53v-23h49z" fill="url(#sgrad)"/>
  </g>
  <path d="M403 111c10 5 20 14 27 24M421 93c15 7 29 20 38 36" fill="none" stroke="#53f4df" stroke-width="10" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
</svg>
