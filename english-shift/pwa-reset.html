<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Apps reparieren</title>
<meta name="theme-color" content="#596beb">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#172039;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:520px;background:white;border:1px solid #e3e7f0;border-radius:22px;padding:24px;box-shadow:0 15px 40px #26324c18}h1{margin-top:0}p{line-height:1.5;color:#5f6880}.ok{color:#18815f;font-weight:800}
</style>
</head>
<body><div class="card"><h1>Apps werden repariert…</h1><p id="msg">Alte App-Caches und Service Worker werden entfernt. Dein Lernfortschritt bleibt erhalten.</p></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('english-shift-shell-')||k.startsWith('stormspeak-shell-')).map(k=>caches.delete(k)));
    }
    msg.className='ok';
    msg.textContent='Fertig. Lernfortschritt wurde nicht gelöscht. English Shift wird jetzt frisch geladen…';
    setTimeout(()=>location.replace('/?pwa-reset=20260818'),900);
  }catch(e){
    msg.textContent='Reset teilweise fehlgeschlagen. Bitte die Seite einmal neu laden.';
  }
})();
</script></body></html>
