<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb">
<title>English Shift</title>
<style>
:root{--bg:#f5f7fb;--ink:#182137;--muted:#788198;--line:#e2e6ef;--brand:#586be9;--good:#31b58e;--bad:#e45a6c;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:28px;font-weight:900;letter-spacing:-.8px}.brand b{color:var(--brand)}.pill,.card,button,input{border:1px solid var(--line);background:#fff;border-radius:16px}.pill{padding:8px 12px;font-size:13px;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:5px}.dot.on{background:var(--good)}.dot.err{background:var(--bad)}.card{padding:18px;margin:12px 0;box-shadow:0 12px 36px #26324c10}.hero{background:linear-gradient(145deg,#fff,#f0f3ff)}h1{font-size:34px;line-height:1.03;margin:13px 0}h3{margin-top:22px}.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:12px 14px;font-weight:800;cursor:pointer;color:var(--ink)}button:disabled{opacity:.55}.primary{background:var(--brand);color:white;border-color:var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat b{font-size:21px}.stat small{display:block;color:var(--muted)}.view{display:none}.view.on{display:block}.q{min-height:380px;padding:22px;background:linear-gradient(145deg,#f8f9ff,#f2fbf7);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;justify-content:center}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}.prompt{font-size:24px;font-weight:850;margin:14px 0}.options{display:grid;gap:8px}.option{text-align:left}.option.sel{border-color:var(--brand);background:#eef0ff}.option.good{border-color:var(--good);background:#eaf9f4}.option.bad{border-color:var(--bad);background:#fff0f2}input{width:100%;padding:14px;font-size:16px}.fb{margin-top:12px;padding:12px;border-radius:14px}.goodfb{background:#eaf9f4}.badfb{background:#fff0f2}.bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}.tiny{font-size:12px}.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 12px 40px #26324c20}.nav{border:0;background:transparent;padding:11px 6px}.nav.active{background:#eef0ff;color:var(--brand)}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}h1{font-size:31px}.prompt{font-size:22px}.pill{font-size:12px}}
</style>
</head><body>
<div class="app">
 <div class="top"><div class="brand">English <b>Shift</b></div><div class="pill"><span id="dot" class="dot"></span><span id="status">AI wird geprüft…</span></div></div>
 <section id="home" class="view on">
  <div class="card hero"><small style="color:#586be9;font-weight:900">DAILY EVERYDAY ENGLISH</small><h1>Train real English.<br>Every single day.</h1><p class="muted">Gemischte Zeitformen, Alltagswortschatz, Listening und adaptive KI-Aufgaben — angepasst an deine Fehler.</p><div class="row"><button id="daily" class="primary">▶ Daily Shift</button><button id="ai">✦ Adaptive AI-Session</button></div><div id="aiNote" class="tiny muted" style="margin-top:10px"></div></div>
  <div class="stats"><div class="card stat"><b id="level">B1+</b><small>Niveau</small></div><div class="card stat"><b id="xp">0</b><small>XP</small></div><div class="card stat"><b id="acc">—</b><small>Trefferquote</small></div><div class="card stat"><b id="sessions">0</b><small>Sessions</small></div></div><div id="focus"></div>
 </section>
 <section id="train" class="view"><div class="card"><div class="row"><button id="back">←</button><div class="bar" style="flex:1;align-self:center"><i id="prog"></i></div><span id="count" class="muted"></span></div><div id="host"></div></div></section>
 <section id="words" class="view"><h3>Active Vocabulary</h3><div id="wordsbox"></div></section>
 <section id="progress" class="view"><h3>Grammar Radar</h3><div id="grammar"></div></section>
</div>
<nav class="bottom"><button class="nav active" data-v="home">⌂ Heute</button><button class="nav" data-v="train">▶ Train</button><button class="nav" data-v="words">Aa Wörter</button><button class="nav" data-v="progress">⌁ Progress</button></nav>
<script>
const BASE=[
{type:'mcq',tense:'Past Simple',prompt:'Which is natural with “yesterday”?',options:['I have seen him yesterday.','I saw him yesterday.','I have saw him yesterday.','I was seeing him yesterday.'],answer:1,best:'I saw him yesterday.',accepted:[],explain:'Finished past time → Past Simple.',audio:''},
{type:'translate',tense:'Future',prompt:'Sag natürlich: „Ich schaffe es wahrscheinlich nicht vor sechs.“',options:[],answer:-1,best:'I probably won’t make it before six.',accepted:['I probably won’t make it before six.','I probably won’t be able to make it before six.'],explain:'make it = es schaffen.',audio:''},
{type:'mcq',tense:'Present Perfect',prompt:'Best answer to “Have you been here before?”',options:['Yes, I was here twice.','Yes, I’ve been here a couple of times.','Yes, I am here before.','Yes, I have been yesterday.'],answer:1,best:'Yes, I’ve been here a couple of times.',accepted:[],explain:'Experience → Present Perfect.',audio:''},
{type:'listen',tense:'Present Perfect Continuous',prompt:'Listen and type what you hear.',options:[],answer:-1,audio:'I’ve been trying to reach customer service all morning.',best:'I’ve been trying to reach customer service all morning.',accepted:['I’ve been trying to reach customer service all morning.','I have been trying to reach customer service all morning.'],explain:'Ongoing activity up to now.'},
{type:'mcq',tense:'Modal verbs',prompt:'Your neighbour is too loud. Choose the natural phrase.',options:['You must be quiet.','Could you keep it down a little, please?','Stop noises.','You should silence yourself.'],answer:1,best:'Could you keep it down a little, please?',accepted:[],explain:'keep it down = leiser sein.',audio:''},
{type:'translate',tense:'Conditional',prompt:'Übersetze: „Wenn ich das gewusst hätte, wäre ich früher losgefahren.“',options:[],answer:-1,best:'If I’d known that, I would have left earlier.',accepted:['If I’d known that, I would have left earlier.','If I had known that, I would have left earlier.'],explain:'Third conditional.',audio:''},
{type:'mcq',tense:'Mixed',prompt:'You are running late. Which text sounds most natural?',options:['I’m a bit behind. I’ll be there in ten.','I have lateness. Ten minutes.','I come later after ten.','I am delayed myself.'],answer:0,best:'I’m a bit behind. I’ll be there in ten.',accepted:[],explain:'A natural everyday way to say you are late.',audio:''},
{type:'listen',tense:'Future',prompt:'Listen and type what you hear.',options:[],answer:-1,audio:'I’ll get back to you as soon as I hear anything.',best:'I’ll get back to you as soon as I hear anything.',accepted:['I’ll get back to you as soon as I hear anything.','I will get back to you as soon as I hear anything.'],explain:'get back to someone = sich zurückmelden.'}
];
const T=['Present Simple','Present Continuous','Present Perfect','Present Perfect Continuous','Past Simple','Past Continuous','Past Perfect','Future','Conditional','Modal verbs','Mixed'];
const V=[['make it','es schaffen'],['keep it down','leiser sein'],['be about to','kurz davor sein'],['get back to someone','sich zurückmelden'],['sort it out','etwas klären'],['run out of','etwas geht aus'],['put off','verschieben'],['be tied up','verhindert sein'],['a bit behind','etwas spät dran'],['work out','klappen / herausfinden']];
let S=JSON.parse(localStorage.getItem('eshift')||'{"xp":0,"sessions":0,"correct":0,"total":0,"level":"B1+","grammar":{}}'),Q=[],i=0,sel=null,AI=false,AIMODEL='',SESSION_SOURCE='local';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){a=norm(a);b=norm(b);const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i),c=new Array(n+1);for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));[p,c]=[c,p]}return p[n]}
function closeEnough(a,b,limit=.04){const x=norm(a),y=norm(b),d=lev(x,y);return d/Math.max(1,x.length,y.length)<=limit}
function accepted(e,user){const list=[e.best,...(Array.isArray(e.accepted)?e.accepted:[])].filter(Boolean);return list.some(x=>norm(x)===norm(user)||closeEnough(x,user,e.type==='listen'?.05:.04))}
function clientGrammarRule(user){const a=String(user||'');const duration='(?:\\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten|several|many|few|a\\s+couple\\s+of|couple\\s+of)\\s+(?:seconds?|minutes?|hours?|days?|weeks?|months?|years?)';if(new RegExp('\\bsince\\s+(?:about\\s+|almost\\s+|nearly\\s+)?'+duration+'\\b','i').test(a))return{correct:false,feedback:'Bei einer Zeitdauer heißt es „for“, nicht „since“: for two hours.',better:a.replace(/\\bsince\\s+/i,'for ')};return null}
function save(){recalcLevel();localStorage.setItem('eshift',JSON.stringify(S))}
function recalcLevel(){if(S.total<20)return;const a=S.correct/S.total;if(S.total>=120&&a>=.84)S.level='C1';else if(S.total>=70&&a>=.82)S.level='B2+';else if(S.total>=35&&a>=.78)S.level='B2';else S.level='B1+'}
function weak(){return[...T].sort((a,b)=>{let A=S.grammar[a]||{c:0,n:0},B=S.grammar[b]||{c:0,n:0};return(A.n?A.c/A.n:.64)-(B.n?B.c/B.n:.64)})}
function view(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='home')dash();if(v==='words')words();if(v==='progress')progress()}
function dash(){$('#level').textContent=S.level;$('#xp').textContent=S.xp;$('#sessions').textContent=S.sessions;$('#acc').textContent=S.total?Math.round(S.correct/S.total*100)+'%':'—';$('#focus').innerHTML='<h3>Heute im Fokus</h3>'+weak().slice(0,3).map(t=>{let g=S.grammar[t]||{c:0,n:0},p=g.n?Math.round(g.c/g.n*100):64;return `<div class="card"><b>${t}</b><span style="float:right">${g.n?p+'%':'neu'}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
function start(a,source='local'){Q=[...a];i=0;SESSION_SOURCE=source;view('train');render()}
function render(){if(i>=Q.length){S.sessions++;save();$('#host').innerHTML=`<div class="q" style="text-align:center"><div class="prompt">✓ Shift complete</div><div class="muted">${SESSION_SOURCE==='ai'?'Adaptive AI-Session abgeschlossen. Deine Ergebnisse fließen in die nächste Session ein.':'Fortschritt gespeichert.'}</div><button id="done" class="primary" style="margin-top:18px">Dashboard</button></div>`;$('#done').onclick=()=>view('home');return}sel=null;let e=Q[i];$('#count').textContent=`${i+1}/${Q.length}`;$('#prog').style.width=`${i/Q.length*100}%`;let h=`<div class="q"><div class="tag">${SESSION_SOURCE==='ai'?'AI · ':''}${e.type} · ${e.tense}</div><div class="prompt">${e.prompt}</div>`;if(e.type==='mcq')h+=`<div class="options">${e.options.map((o,n)=>`<button class="option" data-n="${n}">${o}</button>`).join('')}</div>`;else{if(e.type==='listen')h+='<button id="listen">🔊 Listen</button>';h+='<input id="ans" autocomplete="off" placeholder="Your answer…">'}h+='<div id="fb"></div></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="check" class="primary">Check →</button></div>';$('#host').innerHTML=h;$$('.option').forEach(b=>b.onclick=()=>{sel=+b.dataset.n;$$('.option').forEach(x=>x.classList.toggle('sel',x===b))});if($('#listen'))$('#listen').onclick=()=>speak(e.audio);if($('#ans'))$('#ans').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('#check').click()});$('#check').onclick=check}
function speak(t){if(!('speechSynthesis'in window))return alert('Sprachausgabe wird von diesem Browser nicht unterstützt.');let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
async function check(){
 let e=Q[i],user='',ok=false,feedback='',better=e.best||'';
 if(e.type==='mcq'){if(sel===null)return;user=e.options[sel];ok=sel===e.answer}
 else{
   user=$('#ans').value.trim();if(!user)return;
   const hard=clientGrammarRule(user);
   if(hard){ok=false;feedback=hard.feedback;better=hard.better||better}
   else if(e.type==='translate'&&AI){
     const btn=$('#check');btn.disabled=true;btn.textContent='AI prüft…';
     try{
       const r=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exercise:e,answer:user,level:S.level})});
       const j=await r.json();
       if(!r.ok)throw new Error(j.message||j.error||'evaluation failed');
       ok=j.correct===true;feedback=j.feedback||'';better=j.better||better;
     }catch(err){console.error('AI evaluation failed',err);ok=accepted(e,user);feedback='KI-Prüfung war kurz nicht erreichbar; lokale Kontrolle verwendet.'}
     finally{btn.disabled=false}
   }else ok=accepted(e,user)
 }
 S.total++;if(ok){S.correct++;S.xp+=10}else S.xp+=2;let g=S.grammar[e.tense]||{c:0,n:0};g.n++;if(ok)g.c++;S.grammar[e.tense]=g;save();
 if(e.type==='mcq')$$('.option').forEach((x,n)=>{x.classList.remove('sel');if(n===e.answer)x.classList.add('good');else if(n===sel)x.classList.add('bad')});
 $('#fb').className='fb '+(ok?'goodfb':'badfb');$('#fb').innerHTML=`<b>${ok?'✓ Nice.':'Not quite.'}</b><br>${feedback||e.explain||''}${!ok&&better?`<br><b>Natural:</b> ${better}`:''}`;
 $('#check').disabled=false;$('#check').textContent=i===Q.length-1?'Finish':'Next →';$('#check').onclick=()=>{i++;render()}
}
function words(){$('#wordsbox').innerHTML=V.map(([w,d])=>`<div class="card"><b>${w}</b><br><span class="muted">${d}</span></div>`).join('')}
function progress(){$('#grammar').innerHTML=T.map(t=>{let g=S.grammar[t]||{c:0,n:0},p=g.n?Math.round(g.c/g.n*100):0;return `<div class="card"><b>${t}</b><span style="float:right">${g.n?p+'%':'—'}</span><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
async function health(){try{let r=await fetch('/api/health',{cache:'no-store'}),j=await r.json();AI=!!j.ai;AIMODEL=j.model||''}catch(_){AI=false}$('#dot').classList.toggle('on',AI);$('#dot').classList.toggle('err',!AI);$('#status').textContent=AI?'AI konfiguriert':'AI offline';$('#aiNote').textContent=AI?`OpenAI · ${AIMODEL.replace('openai/','')} · via Vercel AI Gateway`:'Lokaler Daily Shift bleibt verfügbar.'}
async function aiSession(){if(!AI){await health();if(!AI)return alert('Die KI-Konfiguration ist nicht erreichbar.')}$('#ai').disabled=true;$('#ai').innerHTML='<span class="spin">↻</span> AI erstellt Session…';try{const payload={profile:{level:S.level,estimatedLevel:S.level,help:'balanced'},weakTenses:weak().slice(0,5),grammar:S.grammar,recent:[],vocabMastery:{},length:8};let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json();if(!r.ok||!Array.isArray(j.exercises)){let err=new Error(j.message||j.error||'AI generation failed');err.status=r.status;throw err}$('#status').textContent='AI online';start(j.exercises,'ai')}catch(err){console.error(err);if(err.status===429)alert('Das Vercel-AI-Limit ist gerade erreicht. Ich starte eine lokale Session; probiere die AI später erneut.');else alert('Die AI-Session konnte gerade nicht erzeugt werden. Ich starte transparent eine lokale Session.');start([...BASE].sort(()=>Math.random()-.5),'local')}finally{$('#ai').disabled=false;$('#ai').textContent='✦ Adaptive AI-Session'}}
$('#daily').onclick=()=>start([...BASE].sort(()=>Math.random()-.5),'local');$('#ai').onclick=aiSession;$('#back').onclick=()=>view('home');$$('.nav').forEach(b=>b.onclick=()=>b.dataset.v==='train'?start([...BASE].sort(()=>Math.random()-.5),'local'):view(b.dataset.v));dash();health();
</script></body></html>
